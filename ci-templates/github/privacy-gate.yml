# .github/workflows/privacy-gate.yml
# ClawProbe 安卓隐私合规发版门禁 (GitHub Actions 标准模板)
# 文档与凭据申请: https://www.atooli.com/#docs-cli

name: Android Privacy Compliance Gate

on:
  pull_request:
    branches: [ main, release/* ]
  workflow_dispatch:

jobs:
  privacy-preconsent-audit:
    name: ClawProbe Pre-Consent Network Gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ClawProbe CLI & Verify Link
        run: |
          python -m pip install --upgrade pip
          pip install -U --extra-index-url https://www.atooli.com/simple clawprobe
          clawprobe doctor

      # 如果流水线中已有 Gradle 构建步骤，请将下方 APK_PATH 替换为实际产物路径
      - name: Run ClawProbe 300s Sandbox Privacy Gate
        env:
          CLAW_API_KEY: ${{ secrets.CLAW_API_KEY }}
          CLAW_API_SECRET: ${{ secrets.CLAW_API_SECRET }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: |
          clawprobe analyze "$APK_PATH" \
            --attest-authorized \
            --mode privacy \
            --fail-on-preconsent \
            --queue-timeout 900 \
            --out clawprobe-privacy-report.pdf \
            --json-out clawprobe-privacy-report.json \
            --reclaim

      - name: Upload Privacy Audit Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawprobe-privacy-audit-report
          path: |
            clawprobe-privacy-report.pdf
            clawprobe-privacy-report.json
          retention-days: 30
